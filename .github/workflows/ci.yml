name: Check and build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned WebAssembly binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: python tools/verify-vendor.py
      - run: cargo fmt -p sysml-kernel -p sysml-cli -p sysml-wasm -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: npm run format:check
      - run: npm run contract:check
      - run: npm run conformance:check
      - run: npm run requirements:check
      - run: npm run kernel:test
      - run: npm test
      - run: npm run conformance
      - run: npm run requirements:report
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ runner.os }}
          path: |
            target/conformance/report.json
            target/requirements/report.json
          if-no-files-found: ignore
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: npm run desktop:build -- --bundles app --ci
      - name: Build Windows and Linux packages
        if: runner.os != 'macOS'
        run: npm run desktop:build -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: sysml-viewer-${{ runner.os }}
          path: src-tauri/target/release/bundle/
