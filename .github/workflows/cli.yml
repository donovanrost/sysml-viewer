name: CLI builds and releases
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'crates/sysml-cli/**'
      - 'crates/sysml-kernel/**'
      - 'vendor/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'tools/package-cli.py'
      - 'tools/release_version.py'
      - 'tools/verify_cli_release.py'
      - 'tests/test_release*.py'
      - 'package*.json'
      - 'src-tauri/Cargo.*'
      - 'src-tauri/tauri.conf.json'
      - 'docs/cli.md'
      - 'docs/releases/**'
      - 'public/third-party-notices.txt'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - 'crates/sysml-cli/**'
      - 'crates/sysml-kernel/**'
      - 'vendor/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'tools/package-cli.py'
      - 'tools/release_version.py'
      - 'tools/verify_cli_release.py'
      - 'tests/test_release*.py'
      - 'package*.json'
      - 'src-tauri/Cargo.*'
      - 'src-tauri/tauri.conf.json'
      - 'docs/cli.md'
      - 'docs/releases/**'
      - 'public/third-party-notices.txt'
      - '.github/workflows/cli.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_release*.py'
      - id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          args=(--github-output)
          if [[ "$REF_TYPE" == tag ]]; then
            args+=(--tag "$REF_NAME" --publish)
          fi
          python tools/release_version.py "${args[@]}"
  build:
    needs: version
    name: CLI / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt -p sysml-cli -p sysml-kernel -- --check
      - run: cargo clippy --locked -p sysml-cli --all-targets -- -D warnings
      - run: cargo test --locked --release -p sysml-cli --target ${{ matrix.target }}
      - run: cargo test --locked --release -p sysml-kernel --test contracts --target ${{ matrix.target }}
      - run: cargo build --locked --release -p sysml-cli --target ${{ matrix.target }}
      - name: Package native binaries
        run: python tools/package-cli.py --target ${{ matrix.target }} --bin-dir target/${{ matrix.target }}/release
      - uses: actions/upload-artifact@v7
        with:
          name: sysml-${{ matrix.target }}
          path: release/cli/*
          if-no-files-found: error
  publish:
    needs: [version, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: sysml-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete release assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python tools/verify_cli_release.py --version "$VERSION" release-assets
      - name: Publish the tested tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          python tools/release_version.py --tag "$RELEASE_TAG" --publish
          # Do not publish artifacts for a tag that moved while its jobs ran.
          remote_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$remote_commit" = "$(git rev-parse HEAD)"
          notes="docs/releases/$VERSION.md"
          test -f "$notes"
          flags=(--verify-tag --draft --title "SysML $VERSION" --notes-file "$notes")
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease --latest=false)
          fi
          # A draft prevents a partial upload from appearing as a public release.
          # Existing releases are never overwritten by reruns.
          gh release create "$RELEASE_TAG" release-assets/* "${flags[@]}"
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
